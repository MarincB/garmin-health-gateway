<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garmin Today</title>
<style>
  :root {
    color-scheme: light dark;
    --card: light-dark(#f3f2f9, #26272e);
    --card-2: light-dark(#ffffff, #2f3039);
    --text: light-dark(#17181c, #f4f4f6);
    --sub: light-dark(#6b6d78, #9b9da9);
    --line: light-dark(#e1e0ea, #393a45);
    --track: light-dark(#dedde9, #3a3b46);
    --shadow: light-dark(0 1px 2px rgba(30,30,60,.06), 0 1px 0 rgba(255,255,255,.04) inset);
    --green: light-dark(#17a56c, #3ccf91);
    --orange: light-dark(#e8780f, #ff9a3d);
    --red: light-dark(#d93a3a, #ff6a5e);
    --blue: light-dark(#2f7dff, #4f9dff);
    --violet: light-dark(#6a5cf0, #8d83ff);
    --teal: light-dark(#17a89b, #5fe0d0);
    --pink: light-dark(#e0407f, #ff6aa8);
    --purple: light-dark(#8a5cf0, #a98bff);
    --yellow: light-dark(#d9a400, #ffc933);
    --radius: 22px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body {
    font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif);
    color: var(--text); font-size: 15px; line-height: 1.3; -webkit-font-smoothing: antialiased;
  }
  .wrap { padding: 12px 12px 16px; max-width: 520px; margin: 0 auto; }
  h1 { font-size: 26px; font-weight: 650; letter-spacing: -.02em; margin: 6px 4px 2px; }
  .src { color: var(--sub); font-size: 12.5px; margin: 0 4px 14px; }
  h2 { font-size: 19px; font-weight: 650; letter-spacing: -.01em; margin: 22px 4px 10px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .num { font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .unit { color: var(--sub); font-size: .55em; font-weight: 500; margin-left: 3px; letter-spacing: 0; }
  .cap { color: var(--sub); font-size: 13px; }
  .ok { color: var(--green); } .warn { color: var(--orange); } .bad { color: var(--red); }

  /* gauges */
  .rings { display: grid; grid-template-columns: repeat(3, 1fr); }
  .rings > div { text-align: center; padding: 2px 4px; }
  .rings > div + div { border-left: 1px solid var(--line); }
  .rings svg { width: 100%; max-width: 118px; height: auto; display: block; margin: 0 auto 6px; }
  .rings .lbl { font-weight: 600; font-size: 15px; }
  .rings .stat { font-size: 12.5px; margin-top: 1px; }
  .gv { font: 650 30px/1 var(--font-sans, -apple-system, sans-serif); letter-spacing: -.02em; fill: var(--text); text-anchor: middle; }
  .gu { font: 500 14px/1 var(--font-sans, -apple-system, sans-serif); fill: var(--sub); }

  /* plan */
  .plan { display: flex; gap: 12px; align-items: center; }
  .badge { width: 40px; height: 40px; border-radius: 14px; background: var(--card-2); display: grid; place-items: center; flex: none; }
  .plan .t { font-weight: 600; }

  /* fitness age */
  .fa { display: grid; grid-template-columns: 1fr; gap: 6px; text-align: center; }
  .fa .big { font-size: 54px; line-height: 1; }
  .rows { margin-top: 12px; border-top: 1px solid var(--line); }
  .rows > div { display: flex; justify-content: space-between; padding: 10px 2px; border-bottom: 1px solid var(--line); }
  .rows > div:last-child { border-bottom: 0; padding-bottom: 0; }
  .rows b { font-weight: 600; font-variant-numeric: tabular-nums; }

  /* tiles */
  .tile { background: var(--card); border-radius: 20px; padding: 14px 14px 14px 16px; position: relative; min-height: 104px; box-shadow: var(--shadow); }
  .tile .k { color: var(--sub); font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .tile .v { font-size: 30px; margin-top: 8px; }
  .tile .s { font-size: 14.5px; font-weight: 600; margin-top: 6px; display: flex; align-items: center; gap: 5px; }
  .slider { position: absolute; right: 14px; top: 14px; bottom: 14px; width: 22px; border-radius: 12px; background: var(--card-2); }
  .slider i { position: absolute; left: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 3px solid currentColor; background: var(--card); }
  .slider::before { content: ""; position: absolute; left: 7px; right: 7px; top: 22%; bottom: 22%; border-radius: 6px; background: currentColor; opacity: .85; }
  .bar { height: 8px; border-radius: 4px; background: var(--track); margin-top: 10px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 4px; background: var(--blue); }

  /* sleep */
  .stages { display: flex; height: 14px; border-radius: 7px; overflow: hidden; gap: 2px; margin: 12px 0 14px; }
  .stages i { display: block; height: 100%; }
  .stage { background: var(--card-2); border-radius: 16px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; }
  .stage .n { color: var(--sub); font-size: 13.5px; font-weight: 600; }
  .stage .d { font-size: 21px; margin-top: 3px; }
  .stage .p { font-size: 13.5px; font-weight: 650; }
  .row-between { display: flex; justify-content: space-between; align-items: baseline; }

  /* trends */
  .trend { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .trend:last-child { border-bottom: 0; padding-bottom: 0; } .trend:first-child { padding-top: 0; }
  .trend svg { width: 120px; height: 34px; overflow: visible; }
  .foot { color: var(--sub); font-size: 12px; margin: 18px 6px 0; line-height: 1.4; }
  .empty { padding: 36px 8px; text-align: center; color: var(--sub); }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Waiting for data from Garmin…</div></div>
<script>
"use strict";
// ---------- host protocol (MCP Apps, JSON-RPC over postMessage) ----------
var pending = {}, nextId = 1;
function send(m) { parent.postMessage(m, "*"); }
function request(method, params) {
  var id = nextId++;
  return new Promise(function (res) { pending[id] = res; send({ jsonrpc: "2.0", id: id, method: method, params: params }); });
}
function applyHost(ctx) {
  if (!ctx) return;
  if (ctx.theme) document.documentElement.style.colorScheme = ctx.theme;
  var v = ctx.styles && ctx.styles.variables;
  if (v) for (var k in v) if (/^--font-/.test(k)) document.documentElement.style.setProperty(k, v[k]);
  var a = ctx.safeAreaInsets;
  if (a) document.body.style.padding = a.top + "px " + a.right + "px " + a.bottom + "px " + a.left + "px";
}
window.addEventListener("message", function (e) {
  var m = e.data;
  if (!m || m.jsonrpc !== "2.0") return;
  if (m.id !== undefined && !m.method && pending[m.id]) { pending[m.id](m.result); delete pending[m.id]; return; }
  if (m.method === "ui/notifications/tool-result") render(dataOf(m.params));
  else if (m.method === "ui/notifications/host-context-changed") applyHost(m.params);
  else if (m.method === "ui/resource-teardown" && m.id !== undefined) send({ jsonrpc: "2.0", id: m.id, result: {} });
});
function dataOf(r) {
  if (r && r.structuredContent) return r.structuredContent;
  try { return JSON.parse(r.content[0].text); } catch (e) { return null; }
}
if (window.parent !== window) {
  request("ui/initialize", { protocolVersion: "2025-06-18", appInfo: { name: "garmin-today", version: "1.0.0" }, appCapabilities: {} })
    .then(function (r) { applyHost(r && r.hostContext); send({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} }); });
  new ResizeObserver(function () {
    send({ jsonrpc: "2.0", method: "ui/notifications/size-changed", params: { width: Math.ceil(document.documentElement.scrollWidth), height: Math.ceil(document.documentElement.scrollHeight) } });
  }).observe(document.documentElement);
}

// ---------- helpers ----------
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function has(x) { return x !== undefined && x !== null; }
function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
function hm(sec) { var m = Math.round(sec / 60); return Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m"; }
function hmShort(sec) { var m = Math.round(sec / 60); return Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0"); }
function clock(ms) { var d = new Date(ms); return String(d.getUTCHours()).padStart(2, "0") + ":" + String(d.getUTCMinutes()).padStart(2, "0"); }
function title(s) { return String(s || "").toLowerCase().replace(/_/g, " ").replace(/^\w/, function (c) { return c.toUpperCase(); }); }
function polar(cx, cy, r, deg) { var a = (deg - 90) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }
function arc(cx, cy, r, from, to) {
  var p0 = polar(cx, cy, r, from), p1 = polar(cx, cy, r, to), large = (to - from) > 180 ? 1 : 0;
  return "M" + p0[0].toFixed(2) + " " + p0[1].toFixed(2) + " A" + r + " " + r + " 0 " + large + " 1 " + p1[0].toFixed(2) + " " + p1[1].toFixed(2);
}
function grad(id, a, b) { return '<linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + a + '"/><stop offset="1" stop-color="' + b + '"/></linearGradient>'; }

function ring(value, id, c1, c2, unit) {
  var v = clamp(value, 0, 100), end = v >= 100 ? 359.9 : v * 3.6;
  return '<svg viewBox="0 0 120 120"><defs>' + grad(id, c1, c2) + '</defs>' +
    '<circle cx="60" cy="60" r="50" fill="none" stroke="var(--track)" stroke-width="11"/>' +
    (v > 0 ? '<path d="' + arc(60, 60, 50, 0, end) + '" fill="none" stroke="url(#' + id + ')" stroke-width="11" stroke-linecap="round"/>' : "") +
    '<text x="60" y="68" class="gv">' + Math.round(value) + '<tspan class="gu">' + (unit || "") + '</tspan></text></svg>';
}
// Tick dial for Stress: 0 (calm, green) to 100 (high, red)
function dial(value) {
  var ticks = "", n = 40, active = Math.round(clamp(value, 0, 100) / 100 * n);
  var cols = ["#3ccf91", "#9fd84a", "#ffc933", "#ff9a3d", "#ff6a5e"];
  for (var i = 0; i < n; i++) {
    var deg = -135 + i * (270 / (n - 1)), a = polar(60, 60, 53, deg), b = polar(60, 60, 44, deg);
    var col = cols[Math.min(4, Math.floor(i / n * 5))];
    ticks += '<line x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) + '" x2="' + b[0].toFixed(1) + '" y2="' + b[1].toFixed(1) +
      '" stroke="' + (i < Math.max(active, 1) ? col : "var(--track)") + '" stroke-width="3" stroke-linecap="round"/>';
  }
  return '<svg viewBox="0 0 120 120">' + ticks + '<text x="60" y="68" class="gv">' + Math.round(value) + '</text></svg>';
}
function spark(vals, color) {
  var pts = vals.filter(has); if (pts.length < 2) return "";
  var lo = Math.min.apply(null, pts), hi = Math.max.apply(null, pts), span = hi - lo || 1, w = 120, h = 34;
  var xs = vals.map(function (v, i) { return has(v) ? [i / (vals.length - 1) * w, h - 4 - (v - lo) / span * (h - 8)] : null; }).filter(Boolean);
  var d = xs.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
  var last = xs[xs.length - 1];
  return '<svg viewBox="0 0 120 34"><path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="4" fill="var(--card)" stroke="' + color + '" stroke-width="2.4"/></svg>';
}
function slider(pos, color) { return '<div class="slider" style="color:' + color + '"><i style="top:' + (100 - clamp(pos, 0, 1) * 100).toFixed(0) + '%"></i></div>'; }
function tile(k, v, unit, sub, subCls, pos, color) {
  return '<div class="tile"><div class="k">' + k + '</div><div class="v num">' + v + (unit ? '<span class="unit">' + unit + '</span>' : "") + '</div>' +
    (sub ? '<div class="s ' + (subCls || "") + '">' + sub + '</div>' : "") + (has(pos) ? slider(pos, color) : "") + '</div>';
}

// ---------- sections ----------
function render(d) {
  if (!d || !d.date) { $("app").innerHTML = '<div class="empty">No data returned.</div>'; return; }
  var h = [];
  var when = new Date(d.date + "T00:00:00Z").toLocaleDateString("en-US", { month: "long", day: "numeric", timeZone: "UTC" });
  h.push("<h1>Today, " + when + '</h1><p class="src">Data provided by Garmin</p>');

  // rings: Sleep Score, Body Battery, Stress
  var cells = [];
  if (d.sleep && has(d.sleep.score)) cells.push('<div>' + ring(d.sleep.score, "gSleep", "#6a5cf0", "#8fb4ff") + '<div class="lbl">Sleep Score</div><div class="stat" style="color:var(--violet)">' + esc(title(d.sleep.qualifier)) + '</div></div>');
  if (d.body_battery && has(d.body_battery.latest)) cells.push('<div>' + ring(d.body_battery.latest, "gBat", "#31c48d", "#c3e633") + '<div class="lbl">Body Battery</div><div class="stat ok">' + esc(title(d.body_battery.level)) + '</div></div>');
  if (d.stress && has(d.stress.avg)) {
    var s = d.stress.avg, cat = s <= 25 ? ["Resting", "ok"] : s <= 50 ? ["Low", "ok"] : s <= 75 ? ["Medium", "warn"] : ["High", "bad"];
    cells.push('<div>' + dial(s) + '<div class="lbl">Stress</div><div class="stat ' + cat[1] + '">' + cat[0] + '</div></div>');
  }
  if (cells.length) h.push('<div class="card rings" style="grid-template-columns:repeat(' + cells.length + ',1fr)">' + cells.join("") + "</div>");

  if (d.planned_today && d.planned_today.length) {
    h.push("<h2>Plan</h2>" + d.planned_today.map(function (p) {
      var meta = [p.distance_km ? p.distance_km + " km" : "", p.duration_min ? p.duration_min + " min" : ""].filter(Boolean).join(" · ");
      return '<div class="card plan"><div class="badge">🏃</div><div><div class="t">' + esc(p.title) + '</div><div class="cap">' + esc(title(p.kind)) + (meta ? " · " + esc(meta) : "") + "</div></div></div>";
    }).join(""));
  }

  if (d.fitness_age) h.push("<h2>Fitness Age</h2>" + fitnessAge(d.fitness_age));

  // Health Monitor
  var t = [];
  var r = d.resting_heart_rate;
  if (r) {
    var diff = has(r.avg_7d) ? r.value - r.avg_7d : 0, st = Math.abs(diff) < 2 ? ["Normal", "ok", "✓"] : diff > 0 ? ["Higher", "warn", "↑"] : ["Lower", "warn", "↓"];
    t.push(tile("Resting Heart Rate", r.value, "bpm", st[2] + " " + st[0], st[1], 0.5 + clamp(diff, -8, 8) / 16, st[1] === "ok" ? "var(--green)" : "var(--orange)"));
  }
  var v = d.hrv_status;
  if (v) {
    var cls = v.status === "BALANCED" ? "ok" : "warn", pos = has(v.balanced_low) && has(v.balanced_upper) ? (v.last_night - v.balanced_low * 0.8) / (v.balanced_upper * 1.2 - v.balanced_low * 0.8) : undefined;
    t.push(tile("HRV Status", v.last_night, "ms", (v.status === "BALANCED" ? "✓ " : "") + title(v.status), cls, pos, cls === "ok" ? "var(--green)" : "var(--orange)"));
  }
  if (d.spo2) t.push(tile("SpO₂", d.spo2.avg, "%", has(d.spo2.lowest) ? "Lowest " + d.spo2.lowest + "%" : "", "", has(d.spo2.avg) ? (d.spo2.avg - 88) / 12 : undefined, "var(--blue)"));
  if (d.respiration) t.push(tile("Respiration", d.respiration.avg, "rpm", has(d.respiration.low) ? d.respiration.low + "–" + d.respiration.high + " rpm" : "", "", has(d.respiration.avg) ? (d.respiration.avg - 8) / 14 : undefined, "var(--purple)"));
  if (d.sleep) t.push(tile("Sleep", hm(d.sleep.total_s), "", has(d.sleep.need_min) ? "Need " + hm(d.sleep.need_min * 60) : "", "", has(d.sleep.need_min) ? d.sleep.total_s / 60 / d.sleep.need_min / 1.4 : undefined, "var(--violet)"));
  if (d.steps) {
    var pc = d.steps.goal ? clamp(d.steps.value / d.steps.goal, 0, 1) : 0;
    t.push('<div class="tile"><div class="k">Steps</div><div class="v num">' + d.steps.value.toLocaleString("en-US") + '</div><div class="s cap" style="font-weight:500">Goal ' + (d.steps.goal || 0).toLocaleString("en-US") + '</div><div class="bar"><i style="width:' + (pc * 100).toFixed(0) + '%"></i></div></div>');
  }
  if (t.length) h.push("<h2>Health Monitor</h2><div class=\"grid2\">" + t.join("") + "</div>");

  if (d.sleep) h.push("<h2>Sleep</h2>" + sleepCard(d.sleep));
  if (d.trend_7d && d.trend_7d.length > 1) h.push("<h2>Last 7 days</h2>" + trends(d.trend_7d));

  var notes = [];
  if (r) notes.push("Resting Heart Rate status compares today with your 7-day average.");
  if (d.not_available) notes.push(esc(d.not_available));
  if (d.warnings) notes.push("Some data could not be loaded: " + esc(d.warnings.join("; ")));
  if (notes.length) h.push('<p class="foot">' + notes.join("<br>") + "</p>");
  $("app").innerHTML = h.join("");
}

function fitnessAge(f) {
  var lo = f.chronological - 15, hi = f.chronological + 15, pos = function (a) { return clamp((a - lo) / (hi - lo), 0, 1); };
  var A0 = -120, A1 = 120, ang = function (a) { return A0 + pos(a) * (A1 - A0); };
  var dot = function (a, fill, stroke) { var p = polar(100, 100, 78, ang(a)); return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="8" fill="' + fill + '" stroke="' + stroke + '" stroke-width="3"/>'; };
  var diff = f.chronological - f.age, delta = has(f.previous) ? f.age - f.previous : 0;
  var svg = '<svg viewBox="0 0 200 160" style="width:100%;max-width:300px;display:block;margin:0 auto"><defs>' + grad("gFa", "#31c48d", "#c3e633") + '</defs>' +
    '<path d="' + arc(100, 100, 78, A0, A1) + '" fill="none" stroke="var(--track)" stroke-width="12" stroke-linecap="round"/>' +
    '<path d="' + arc(100, 100, 78, A0, Math.max(ang(f.age), A0 + 1)) + '" fill="none" stroke="url(#gFa)" stroke-width="12" stroke-linecap="round"/>' +
    dot(f.chronological, "var(--card)", "var(--sub)") + dot(f.age, "var(--card)", "var(--green)") +
    '<text x="100" y="98" class="gv" style="font-size:44px">' + f.age.toFixed(1) + '</text><text x="100" y="120" class="gu" text-anchor="middle">years</text></svg>';
  var rows = [["Chronological age", f.chronological + " yrs"]];
  if (has(f.resting_hr)) rows.push(["Resting heart rate", f.resting_hr + " bpm"]);
  if (has(f.vigorous_minutes_avg)) rows.push(["Vigorous minutes / week", String(f.vigorous_minutes_avg)]);
  if (has(f.vigorous_days_avg)) rows.push(["Vigorous days / week", String(f.vigorous_days_avg)]);
  if (has(f.bmi)) rows.push(["BMI", String(f.bmi)]);
  return '<div class="card fa">' + svg + '<div class="' + (diff >= 0 ? "ok" : "warn") + '" style="font-weight:650">' + Math.abs(diff).toFixed(1) + " years " + (diff >= 0 ? "younger" : "older") + " than your age</div>" +
    (has(f.previous) ? '<div class="cap">' + (delta === 0 ? "Unchanged" : (delta < 0 ? "▼ " : "▲ ") + Math.abs(delta).toFixed(1)) + " since last update</div>" : "") +
    '<div class="rows">' + rows.map(function (r) { return "<div><span class=\"cap\">" + r[0] + "</span><b>" + r[1] + "</b></div>"; }).join("") + "</div></div>";
}

function sleepCard(s) {
  var segs = [["Deep", s.deep_s, "var(--violet)"], ["Light", s.light_s, "var(--blue)"], ["REM", s.rem_s, "var(--teal)"], ["Awake", s.awake_s, "var(--orange)"]].filter(function (x) { return x[1]; });
  var tot = segs.reduce(function (a, x) { return a + x[1]; }, 0) || 1;
  var pctOf = { Deep: s.stages && s.stages.deep_pct, Light: s.stages && s.stages.light_pct, REM: s.stages && s.stages.rem_pct };
  var head = '<div class="row-between"><div><div class="num" style="font-size:28px">' + hm(s.total_s) + '</div><div class="cap">Time asleep</div></div>' +
    (has(s.start_local) ? '<div class="cap">' + clock(s.start_local) + " – " + clock(s.end_local) + "</div>" : "") + "</div>";
  var bar = '<div class="stages">' + segs.map(function (x) { return '<i style="width:' + (x[1] / tot * 100).toFixed(1) + "%;background:" + x[2] + '"></i>'; }).join("") + "</div>";
  var list = '<div class="grid2">' + segs.map(function (x) {
    var p = has(pctOf[x[0]]) ? pctOf[x[0]] : Math.round(x[1] / tot * 100);
    return '<div class="stage"><div><div class="n">' + x[0] + '</div><div class="d num">' + hmShort(x[1]) + '</div></div><div class="p" style="color:' + x[2] + '">' + p + "%</div></div>";
  }).join("") + "</div>";
  return '<div class="card">' + head + bar + list + "</div>";
}

function trends(rows) {
  var spec = [["Resting Heart Rate", "resting_hr", "bpm", "var(--pink)"], ["Stress", "stress_avg", "", "var(--orange)"], ["Body Battery (high)", "body_battery_max", "", "var(--green)"]];
  return '<div class="card">' + spec.map(function (s) {
    var vals = rows.map(function (r) { return r[s[1]]; }), last = vals.filter(has).pop();
    if (!has(last)) return "";
    return '<div class="trend"><div><div class="cap">' + s[0] + '</div><div class="num" style="font-size:24px">' + last + (s[2] ? '<span class="unit">' + s[2] + "</span>" : "") + "</div></div>" + spark(vals, s[3]) + "</div>";
  }).join("") + "</div>";
}

window.__render = render; // test harness hook
</script>
