<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garmin Today</title>
<style>
  :root {
    color-scheme: light dark;
    --page: light-dark(#ecf0f3, #272c37);
    --card: var(--page);
    --card-hi: light-dark(#eef2f5, #2a303b);
    --card-lo: light-dark(#eaeef1, #252a35);
    --card-bg: linear-gradient(145deg, var(--card-hi), var(--card-lo));
    --card-2: light-dark(#ffffff, #2f3039);
    --text: light-dark(#17181c, #f4f4f6);
    --sub: light-dark(#6b6d78, #98a0b3);
    --line: light-dark(#e1e0ea, #343b49);
    --track: light-dark(#e1e7ee, #21262f);
    /* Neumorphism with layered, realistic shadows. One light source top-left. Every shadow is a pair
       (soft ambient + tight contact) and blur is about twice the offset. Dark mode: near-black shadow,
       highlight only a shade lighter than the surface. Light mode: white highlight, violet-grey shadow. */
    --sh-d:  light-dark(rgba(209,217,230,.78), rgba(14,17,24,.52));
    --sh-d2: light-dark(rgba(197,206,221,.8), rgba(10,12,18,.55));
    --sh-l:  light-dark(rgba(255,255,255,.78), rgba(78,89,114,.46));
    --sh-l2: var(--sh-l);
    /* main cards: the top-left highlight only exists in light mode (it is invisible there anyway) */
    --sh-lc: light-dark(rgba(255,255,255,.78), transparent);
    --edge-col: light-dark(rgba(255,255,255,.6), transparent);
    --edge-c: inset 0 1px 0 var(--edge-col);
    --shadow:    9px 9px 18px var(--sh-d);
    --shadow-c:    7px 7px 15px var(--sh-d);
    --shadow-c-hi: -7px -7px 15px var(--sh-lc);
    --shadow-hi: -14px -14px 26px var(--sh-l);
    --shadow-s:    7px 7px 13px var(--sh-d);
    --shadow-s-hi: -7px -7px 13px var(--sh-lc);
    --edge: inset 0 0 0 transparent;
    --inset-m:    inset 5px 5px 11px var(--sh-d);
    --inset-m-hi: inset -5px -5px 11px var(--sh-l);
    --inset:    inset 3px 3px 7px var(--sh-d);
    --inset-hi: inset -3px -3px 7px var(--sh-l);
    --band: light-dark(#c7c6d6, #5a5c6a);
    --green: light-dark(#0f9d8a, #3fd6bd);
    --orange: light-dark(#e5683f, #ff8f6b);
    --red: light-dark(#d6455d, #ff6b84);
    --blue: light-dark(#4c6ef5, #7d94ff);
    --violet: light-dark(#7c5cf0, #a58cff);
    --teal: light-dark(#0e9bb0, #4fd3e6);
    --pink: light-dark(#e0507a, #ff7fa3);
    --purple: light-dark(#a855d6, #d08cf5);
    --yellow: light-dark(#d99a00, #ffc15a);
    --radius: 22px;
  }
  * { box-sizing: border-box; }
  html { background: transparent; }
  body { margin: 0; background: var(--page); border-radius: 26px; }
  body {
    font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif);
    color: var(--text); font-size: 15px; line-height: 1.3; -webkit-font-smoothing: antialiased;
  }
  .wrap { padding: 26px 24px 30px; max-width: 520px; margin: 0 auto; }
  h1 { font-size: 26px; font-weight: 600; letter-spacing: -.02em; margin: 6px 4px 2px; }
  .src { color: var(--sub); font-size: 12.5px; margin: 0 4px 14px; }
  h2 { font-size: 19px; font-weight: 600; letter-spacing: -.01em; margin: 30px 4px 14px; }
  .card { background: var(--card-bg); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-c), var(--shadow-c-hi), var(--edge-c); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .num { font-weight: 500; letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
  .unit { color: var(--sub); font-size: .46em; font-weight: 400; margin-left: 4px; letter-spacing: 0; }
  .cap { color: var(--sub); font-size: 13px; }
  .ok { color: var(--green); } .warn { color: var(--orange); } .bad { color: var(--red); }

  /* gauges */
  .rings { display: grid; grid-template-columns: repeat(3, 1fr); }
  .rings > div { text-align: center; padding: 2px 4px; }
  .rings > div + div { border-left: 1px solid var(--line); }
  .rings > div { padding: 6px 4px; }
  .rings path { filter: drop-shadow(1.5px 2px 2px var(--sh-d2)); }
  .plate { fill: var(--page); filter: drop-shadow(4px 4px 6px var(--sh-d)) drop-shadow(-4px -4px 6px var(--sh-l)); }
  .disc { fill: var(--page); filter: drop-shadow(3px 3px 4px var(--sh-d)) drop-shadow(-3px -3px 4px var(--sh-l)); }
  .glow { filter: blur(9px); opacity: .28; }
  .rings svg { width: 100%; max-width: 118px; height: auto; display: block; margin: 0 auto 6px; }
  .rings .lbl { font-weight: 500; font-size: 15px; }
  .rings .stat { font-size: 12.5px; margin-top: 1px; }
  .gv { font: 500 30px/1 var(--font-sans, -apple-system, sans-serif); letter-spacing: -.02em; fill: var(--text); text-anchor: middle; }
  .gu { font: 500 14px/1 var(--font-sans, -apple-system, sans-serif); fill: var(--sub); }

  /* plan */
  .plan { display: flex; gap: 12px; align-items: center; }
  .badge { width: 40px; height: 40px; border-radius: 14px; background: var(--track); box-shadow: var(--inset), var(--inset-hi); display: grid; place-items: center; flex: none; }
  .plan .t { font-weight: 600; }

  /* fitness age */
  .fa { display: grid; grid-template-columns: 1fr; gap: 6px; text-align: center; }
  .fa .big { font-size: 54px; line-height: 1; }
  .rows { margin-top: 12px; border-top: 1px solid var(--line); }
  .rows > div { display: flex; justify-content: space-between; padding: 10px 2px; border-bottom: 1px solid var(--line); }
  .rows > div:last-child { border-bottom: 0; padding-bottom: 0; }
  .rows b { font-weight: 600; font-variant-numeric: tabular-nums; }

  /* tiles */
  .tile { --tint: var(--blue); --amt: 0%; border-radius: 20px; padding: 14px 14px 14px 16px; position: relative; min-height: 104px;
    background: linear-gradient(135deg, var(--card-hi) 0%, var(--card-lo) 55%, color-mix(in srgb, var(--tint) var(--amt), var(--card-lo)) 130%);
    box-shadow: var(--shadow-s), var(--shadow-s-hi), var(--edge-c); }
  .tile::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(120% 90% at 100% 100%, color-mix(in srgb, var(--tint) calc(var(--amt) * .55), transparent), transparent 62%); }
  .tile > * { position: relative; z-index: 1; }
  .tile .k { padding-right: 34px; color: var(--sub); font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .tile .v { font-size: clamp(25px, 7.4vw, 32px); margin-top: 8px; padding-right: 26px; white-space: nowrap; }
  .tile .s { font-size: 14.5px; font-weight: 600; margin-top: 6px; display: flex; align-items: center; gap: 5px; }
  .slider { position: absolute; right: 14px; top: 14px; bottom: 14px; width: 22px; border-radius: 12px; background: var(--track); box-shadow: var(--inset), var(--inset-hi); z-index: 1; }
  .slider i { position: absolute; left: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 3px solid currentColor; background: var(--card); }
  .slider::after { content: ""; position: absolute; left: 3px; width: 4px; top: 12px; bottom: 12px; background: repeating-linear-gradient(to bottom, var(--sh-d) 0 1px, transparent 1px 7px); opacity: .7; }
  .slider::before { content: ""; position: absolute; left: 7px; right: 7px; top: 6%; bottom: 6%; border-radius: 6px;
    background: linear-gradient(to bottom, transparent 0%, currentColor 30%, currentColor 70%, transparent 100%); opacity: .9; }
  .bar { height: 9px; border-radius: 5px; background: var(--track); box-shadow: var(--inset), var(--inset-hi); margin-top: 10px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 4px; background: var(--blue); }

  /* sleep */
  .stages { display: flex; height: 16px; border-radius: 8px; overflow: hidden; gap: 2px; margin: 12px 0 16px; padding: 2px; background: var(--track); box-shadow: var(--inset), var(--inset-hi); }
  .stages i { border-radius: 6px; }
  .stages i { display: block; height: 100%; }
  .stage { background: var(--card); box-shadow: var(--inset-m), var(--inset-m-hi); border-radius: 16px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; }
  .stage .n { color: var(--sub); font-size: 13.5px; font-weight: 600; }
  .stage .d { font-size: 21px; margin-top: 3px; }
  .stage .p { font-size: 13.5px; font-weight: 650; }
  .row-between { display: flex; justify-content: space-between; align-items: baseline; }

  /* trends */
  .trend { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .trend:last-child { border-bottom: 0; padding-bottom: 0; } .trend:first-child { padding-top: 0; }
  .trend svg { overflow: visible; }
  .foot { color: var(--sub); font-size: 12px; margin: 18px 6px 0; line-height: 1.4; }
  /* on-load motion: only when JS marks #app.anim, and never with reduced motion */
  .anim .reveal { opacity: 0; transform: translateY(10px); transition: opacity .6s ease, transform .7s cubic-bezier(.22,.8,.3,1); transition-delay: var(--d, 0ms); }
  .anim .reveal.in { opacity: 1; transform: none; }
  .anim .tick { opacity: 0; transition: opacity .3s ease; }
  .anim .tick.in { opacity: 1; }
  .anim .dot { opacity: 0; transition: opacity .4s ease 1s; }
  .anim .in .dot { opacity: 1; }
  .empty { padding: 36px 8px; text-align: center; color: var(--sub); }
  .banner { background: var(--card-bg); box-shadow: var(--shadow-s), var(--shadow-s-hi), var(--edge); border-radius: 16px; padding: 12px 14px; margin: 0 0 18px; font-size: 13.5px; line-height: 1.4; }
  .banner b { color: var(--orange); }
  .btn { font: inherit; font-weight: 500; color: #fff; background: linear-gradient(135deg, #8c9bff, #4c6ef5); border: 0; border-radius: 16px; padding: 12px 22px; cursor: pointer; margin-top: 12px;
    box-shadow: 0 10px 22px rgba(76,110,245,.35), inset 0 1px 0 rgba(255,255,255,.4); }
  .btn:active { box-shadow: inset 3px 3px 7px rgba(20,30,110,.4), inset -2px -2px 5px rgba(255,255,255,.25); }
  .btn[disabled] { opacity: .6; cursor: default; }
  @media (max-width: 480px) {
    body { border-radius: 20px; }
    .wrap { padding: 16px 10px 20px; }
    :root { --radius: 20px;
      --shadow: 7px 7px 14px var(--sh-d); --shadow-hi: -7px -7px 14px var(--sh-l); --shadow-c: 5px 5px 11px var(--sh-d); --shadow-c-hi: -5px -5px 11px var(--sh-lc);
      --shadow-s: 5px 5px 10px var(--sh-d); --shadow-s-hi: -5px -5px 10px var(--sh-lc);
      --inset-m: inset 4px 4px 8px var(--sh-d); --inset-m-hi: inset -4px -4px 8px var(--sh-l); }
    h1 { font-size: 23px; margin: 4px 4px 2px; }
    h2 { margin: 24px 4px 12px; font-size: 18px; }
    .card { padding: 14px 12px; }
    .grid2 { gap: 12px; }
    .tile { padding: 12px 10px 12px 13px; min-height: 96px; }
    .tile .k { font-size: 13px; padding-right: 26px; }
    .tile .s { font-size: 13.5px; }
    .slider { width: 18px; right: 10px; top: 12px; bottom: 12px; border-radius: 10px; }
    .slider i { width: 12px; height: 12px; margin: -6px 0 0 -6px; border-width: 2.5px; }
    .slider::after { display: none; }
    .rings > div { padding: 4px 0; }
    .rings .lbl { font-size: 13.5px; white-space: nowrap; }
    .rings .stat { font-size: 12px; }
    .stage { padding: 10px 12px; }
    .stage .d { font-size: 19px; }
    .trend svg { width: 112px !important; height: auto !important; }
    .rows > div { padding: 9px 2px; }
    .fa .big { font-size: 46px; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Waiting for data from Garmin…</div></div>
<script>
"use strict";
// ---------- host protocol (MCP Apps, JSON-RPC over postMessage) ----------
var pending = {}, nextId = 1;
function send(m) { parent.postMessage(m, "*"); }
function request(method, params) {
  var id = nextId++;
  return new Promise(function (res) { pending[id] = res; send({ jsonrpc: "2.0", id: id, method: method, params: params }); });
}
function applyHost(ctx) {
  if (!ctx) return;
  if (ctx.theme) document.documentElement.style.colorScheme = ctx.theme;
  var v = ctx.styles && ctx.styles.variables;
  if (v) for (var k in v) if (/^--font-/.test(k)) document.documentElement.style.setProperty(k, v[k]);
  var a = ctx.safeAreaInsets;
  if (a) document.body.style.padding = a.top + "px " + a.right + "px " + a.bottom + "px " + a.left + "px";
}
window.addEventListener("message", function (e) {
  var m = e.data;
  if (!m || m.jsonrpc !== "2.0") return;
  if (m.id !== undefined && !m.method && pending[m.id]) { pending[m.id](m.error ? null : m.result); delete pending[m.id]; return; }
  if (m.method === "ui/notifications/tool-result") render(dataOf(m.params));
  else if (m.method === "ui/notifications/host-context-changed") applyHost(m.params);
  else if (m.method === "ui/resource-teardown" && m.id !== undefined) send({ jsonrpc: "2.0", id: m.id, result: {} });
});
function dataOf(r) {
  if (r && r.structuredContent) return r.structuredContent;
  try { return JSON.parse(r.content[0].text); } catch (e) { return null; }
}
if (window.parent !== window) {
  request("ui/initialize", { protocolVersion: "2025-06-18", appInfo: { name: "garmin-today", version: "1.0.0" }, appCapabilities: {} })
    .then(function (r) { applyHost(r && r.hostContext); send({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} }); });
  new ResizeObserver(function () {
    send({ jsonrpc: "2.0", method: "ui/notifications/size-changed", params: { width: Math.ceil(document.documentElement.scrollWidth), height: Math.ceil(document.documentElement.scrollHeight) } });
  }).observe(document.documentElement);
}

// ---------- helpers ----------
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function has(x) { return x !== undefined && x !== null; }
function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
function hm(sec) { var m = Math.round(sec / 60); return Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m"; }
function hmShort(sec) { var m = Math.round(sec / 60); return Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0"); }
function clock(ms) { var d = new Date(ms); return String(d.getUTCHours()).padStart(2, "0") + ":" + String(d.getUTCMinutes()).padStart(2, "0"); }
function title(s) { return String(s || "").toLowerCase().replace(/_/g, " ").replace(/^\w/, function (c) { return c.toUpperCase(); }); }
function ago(ms) {
  var m = Math.max(0, Math.round(ms / 60000));
  if (m < 2) return "just now";
  if (m < 90) return m + " min ago";
  if (m < 36 * 60) return Math.round(m / 60) + " h ago";
  return Math.round(m / 1440) + " d ago";
}
function polar(cx, cy, r, deg) { var a = (deg - 90) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }
function arc(cx, cy, r, from, to) {
  var p0 = polar(cx, cy, r, from), p1 = polar(cx, cy, r, to), large = (to - from) > 180 ? 1 : 0;
  return "M" + p0[0].toFixed(2) + " " + p0[1].toFixed(2) + " A" + r + " " + r + " 0 " + large + " 1 " + p1[0].toFixed(2) + " " + p1[1].toFixed(2);
}
function grad(id, a, b) { return '<linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + a + '"/><stop offset="1" stop-color="' + b + '"/></linearGradient>'; }

function ring(value, id, c1, c2, unit) {
  var v = clamp(value, 0, 100), end = v >= 100 ? 359.9 : v * 3.6;
  return '<svg viewBox="-8 -8 136 136"><defs>' + grad(id, c1, c2) + '</defs>' +
    '<circle class="plate" cx="60" cy="60" r="62"/>' +
    '<circle cx="60" cy="60" r="50" fill="none" stroke="var(--track)" stroke-width="11"/>' +
    '<circle cx="60" cy="60" r="44.2" fill="none" stroke="var(--sh-d2)" stroke-width="1.4"/>' +
    '<circle cx="60" cy="60" r="55.8" fill="none" stroke="var(--sh-l)" stroke-width="1.4"/>' +
    (v > 0 ? '<path class="draw" d="' + arc(60, 60, 50, 0, end) + '" fill="none" stroke="url(#' + id + ')" stroke-width="11" stroke-linecap="round"/>' : "") +
    '<circle class="glow" cx="60" cy="60" r="30" fill="' + c2 + '"/>' +
    '<circle class="disc" cx="60" cy="60" r="38"/>' +
    '<text x="60" y="69" class="gv" data-count="' + Math.round(value) + '">' + Math.round(value) + '<tspan class="gu">' + (unit || "") + '</tspan></text></svg>';
}
// Tick dial for Stress: 0 (calm, green) to 100 (high, red)
function dial(value) {
  var ticks = "", n = 40, active = Math.round(clamp(value, 0, 100) / 100 * n);
  var cols = ["#2ec4b6", "#6fd3a2", "#ffc857", "#ff8a4c", "#ff5d73"];
  for (var i = 0; i < n; i++) {
    var deg = -135 + i * (270 / (n - 1)), a = polar(60, 60, 52, deg), b = polar(60, 60, 44, deg);
    var col = cols[Math.min(4, Math.floor(i / n * 5))];
    ticks += '<line class="tick" x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) + '" x2="' + b[0].toFixed(1) + '" y2="' + b[1].toFixed(1) +
      '" stroke="' + (i < Math.max(active, 1) ? col : "var(--track)") + '" stroke-width="3" stroke-linecap="round"/>';
  }
  return '<svg viewBox="-8 -8 136 136"><circle class="plate" cx="60" cy="60" r="62"/>' + ticks +
    '<circle class="disc" cx="60" cy="60" r="36"/><text x="60" y="69" class="gv" data-count="' + Math.round(value) + '">' + Math.round(value) + '</text></svg>';
}
var sparkId = 0;
function spark(vals, color) {
  var pts = vals.filter(has); if (pts.length < 2) return "";
  var lo = Math.min.apply(null, pts), hi = Math.max.apply(null, pts), span = hi - lo || 1, w = 140, h = 46, top = 6, bot = h - 4;
  var xs = vals.map(function (v, i) { return has(v) ? [i / (vals.length - 1) * w, bot - (v - lo) / span * (bot - top)] : null; }).filter(Boolean);
  var d = "M" + xs[0][0].toFixed(1) + " " + xs[0][1].toFixed(1);
  for (var i = 1; i < xs.length; i++) { var mx = (xs[i - 1][0] + xs[i][0]) / 2; d += " C" + mx.toFixed(1) + " " + xs[i - 1][1].toFixed(1) + " " + mx.toFixed(1) + " " + xs[i][1].toFixed(1) + " " + xs[i][0].toFixed(1) + " " + xs[i][1].toFixed(1); }
  var last = xs[xs.length - 1], id = "sp" + (sparkId++);
  return '<svg viewBox="0 0 140 46" style="width:140px;height:46px"><defs>' +
    '<linearGradient id="' + id + 's" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="' + w + '" y2="0"><stop offset="0" stop-color="' + color + '" stop-opacity=".35"/><stop offset="1" stop-color="' + color + '"/></linearGradient>' +
    '<linearGradient id="' + id + 'f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + color + '" stop-opacity=".38"/><stop offset="1" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>' +
    '<path d="' + d + " L" + last[0].toFixed(1) + " " + h + " L" + xs[0][0].toFixed(1) + " " + h + ' Z" class="fillarea" fill="url(#' + id + 'f)"/>' +
    '<path class="draw" d="' + d + '" fill="none" stroke="url(#' + id + 's)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<circle class="dot" cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="4.2" fill="var(--card-hi)" stroke="' + color + '" stroke-width="2.4"/></svg>';
}
// 0..1 where 1 means "right in the middle of the healthy range"
function near(pos) { return has(pos) ? 1 - clamp(Math.abs(pos - 0.5) * 2, 0, 1) : 0.4; }
function amtOf(pos, ok) { return (ok ? 16 : 10) + near(pos) * (ok ? 26 : 14); }
function slider(pos, color) { return '<div class="slider" style="color:' + color + '"><i style="top:' + (100 - clamp(pos, 0, 1) * 100).toFixed(0) + '%"></i></div>'; }
function tile(k, v, unit, sub, subCls, pos, color, amt) {
  return '<div class="tile" style="--tint:' + color + ";--amt:" + Math.round(has(amt) ? amt : 14) + '%"><div class="k">' + k + '</div><div class="v num"' + (typeof v === "number" ? ' data-count="' + v + '"' : "") + ">" + v + (unit ? '<span class="unit">' + unit + '</span>' : "") + '</div>' +
    (sub ? '<div class="s ' + (subCls || "") + '">' + sub + '</div>' : "") + (has(pos) ? slider(pos, color) : "") + '</div>';
}

// ---------- sections ----------
function render(d) {
  if (!d || !d.date) { $("app").innerHTML = '<div class="empty">No data returned.</div>'; return; }
  var h = [];
  var when = new Date(d.date + "T00:00:00Z").toLocaleDateString("en-US", { month: "long", day: "numeric", timeZone: "UTC" });
  var src = ["Data provided by Garmin"];
  if (d.fetched_at && !oldStale) src.push("Loaded " + new Date(d.fetched_at).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }));
  var info = "";
  if (has(d.synced_age_min) && !oldStale) {
    var behind = d.synced_age_min > 120;
    info = '<br><span class="' + (behind ? "warn" : "") + '">Watch last synced ' + ago(d.synced_age_min * 60000) + (behind ? ": steps and heart data may be behind" : "") + "</span>";
  }
  h.push("<h1>Today, " + when + '</h1><p class="src">' + src.join(" · ") + info + "</p>");
  var oldStale = d.stale && Date.now() - Date.parse(d.stale.saved_at) > 20 * 60000; // a copy this recent is as good as live
  if (oldStale) {
    var at = new Date(d.stale.saved_at);
    h.push('<div class="banner"><b>Showing saved data</b> from ' + at.toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) +
      " (" + ago(Date.now() - at.getTime()) + "). Garmin is not answering right now.<br><button class=\"btn\" onclick=\"refresh(this)\">Refresh</button></div>");
  }

  // rings: Sleep Score, Body Battery, Stress
  var cells = [];
  if (d.sleep && has(d.sleep.score)) cells.push('<div>' + ring(d.sleep.score, "gSleep", "#1aa6b7", "#7ee7d6") + '<div class="lbl">Sleep Score</div><div class="stat" style="color:var(--teal)">' + esc(title(d.sleep.qualifier)) + '</div></div>');
  if (d.body_battery && has(d.body_battery.latest)) cells.push('<div>' + ring(d.body_battery.latest, "gBat", "#ff8a4c", "#ffc857") + '<div class="lbl">Body Battery</div><div class="stat warn">' + esc(title(d.body_battery.level)) + '</div></div>');
  if (d.stress && has(d.stress.avg)) {
    var s = d.stress.avg, cat = s <= 25 ? ["Resting", "ok"] : s <= 50 ? ["Low", "ok"] : s <= 75 ? ["Medium", "warn"] : ["High", "bad"];
    cells.push('<div>' + dial(s) + '<div class="lbl">Stress</div><div class="stat ' + cat[1] + '">' + cat[0] + '</div></div>');
  }
  if (cells.length) h.push('<div class="card rings" style="grid-template-columns:repeat(' + cells.length + ',1fr)">' + cells.join("") + "</div>");

  if (d.planned_today && d.planned_today.length) {
    h.push("<h2>Plan</h2>" + d.planned_today.map(function (p) {
      var meta = [p.distance_km ? p.distance_km + " km" : "", p.duration_min ? p.duration_min + " min" : ""].filter(Boolean).join(" · ");
      return '<div class="card plan"><div class="badge">🏃</div><div><div class="t">' + esc(p.title) + '</div><div class="cap">' + esc(title(p.kind)) + (meta ? " · " + esc(meta) : "") + "</div></div></div>";
    }).join(""));
  }

  if (d.fitness_age) h.push("<h2>Fitness Age</h2>" + fitnessAge(d.fitness_age));

  // Health Monitor
  var t = [];
  var r = d.resting_heart_rate;
  if (r) {
    var diff = has(r.avg_7d) ? r.value - r.avg_7d : 0, st = Math.abs(diff) < 2 ? ["Normal", "ok", "✓"] : diff > 0 ? ["Higher", "warn", "↑"] : ["Lower", "warn", "↓"];
    t.push(tile("Resting Heart Rate", r.value, "bpm", st[2] + " " + st[0], st[1], 0.5 + clamp(diff, -8, 8) / 16, st[1] === "ok" ? "var(--green)" : "var(--orange)", amtOf(0.5 - Math.abs(diff) / 16, st[1] === "ok")));
  }
  var v = d.hrv_status;
  if (v) {
    var cls = v.status === "BALANCED" ? "ok" : "warn", pos = has(v.balanced_low) && has(v.balanced_upper) ? (v.last_night - v.balanced_low * 0.8) / (v.balanced_upper * 1.2 - v.balanced_low * 0.8) : undefined;
    t.push(tile("HRV Status", v.last_night, "ms", (v.status === "BALANCED" ? "✓ " : "") + title(v.status), cls, pos, cls === "ok" ? "var(--green)" : "var(--orange)", amtOf(pos, cls === "ok")));
  }
  if (d.spo2) t.push(tile("SpO₂", d.spo2.avg, "%", has(d.spo2.lowest) ? "Lowest " + d.spo2.lowest + "%" : "", "", has(d.spo2.avg) ? (d.spo2.avg - 88) / 12 : undefined, "var(--teal)", amtOf(has(d.spo2.avg) ? (d.spo2.avg - 88) / 12 : undefined, true)));
  if (d.respiration) t.push(tile("Respiration", d.respiration.avg, "rpm", has(d.respiration.low) ? d.respiration.low + "–" + d.respiration.high + " rpm" : "", "", has(d.respiration.avg) ? (d.respiration.avg - 8) / 14 : undefined, "var(--purple)", amtOf(has(d.respiration.avg) ? (d.respiration.avg - 8) / 14 : undefined, true)));
  if (d.sleep) t.push(tile("Sleep", hm(d.sleep.total_s), "", has(d.sleep.need_min) ? "Need " + hm(d.sleep.need_min * 60) : "", "", has(d.sleep.need_min) ? d.sleep.total_s / 60 / d.sleep.need_min / 1.4 : undefined, "var(--blue)", amtOf(has(d.sleep.need_min) ? d.sleep.total_s / 60 / d.sleep.need_min / 1.4 : undefined, true)));
  if (d.steps) {
    var pc = d.steps.goal ? clamp(d.steps.value / d.steps.goal, 0, 1) : 0;
    t.push('<div class="tile" style="--tint:var(--blue);--amt:' + Math.round(10 + pc * 30) + '%"><div class="k">Steps</div><div class="v num" data-count="' + d.steps.value + '" data-loc="1">' + d.steps.value.toLocaleString("en-US") + '</div><div class="s cap" style="font-weight:500">Goal ' + (d.steps.goal || 0).toLocaleString("en-US") + '</div><div class="bar"><i data-w="' + (pc * 100).toFixed(0) + '" style="width:' + (pc * 100).toFixed(0) + '%"></i></div></div>');
  }
  if (t.length) h.push("<h2>Health Monitor</h2><div class=\"grid2\">" + t.join("") + "</div>");

  if (d.sleep) h.push("<h2>Sleep</h2>" + sleepCard(d.sleep));
  if (d.trend_7d && d.trend_7d.length > 1) h.push("<h2>Last 7 days</h2>" + trends(d.trend_7d));

  if (!cells.length && !t.length && !d.fitness_age && !d.sleep) {
    h.push('<div class="card empty">Garmin did not return any data right now.<br><button class="btn" onclick="refresh(this)">Try again</button></div>');
  }
  var notes = [];
  if (r) notes.push("Resting Heart Rate status compares today with your 7-day average.");
  if (d.filled_from_saved) {
    var names = { sleep: "Sleep Score", body_battery: "Body Battery", stress: "Stress", hrv_status: "HRV Status", resting_heart_rate: "Resting Heart Rate", spo2: "SpO₂", respiration: "Respiration", steps: "Steps", fitness_age: "Fitness Age", trend_7d: "7-day trends" };
    notes.push("From an earlier load (" + ago(Date.now() - new Date(d.filled_from_saved.oldest_at).getTime()) + "): " + d.filled_from_saved.sections.map(function (k) { return names[k] || k; }).join(", ") + ".");
  }
  if (d.not_available) notes.push(esc(d.not_available));
  if (d.warnings) notes.push("Some data could not be loaded: " + esc(d.warnings.join("; ")));
  if (notes.length) h.push('<p class="foot">' + notes.join("<br>") + "</p>");
  $("app").innerHTML = h.join("");
  prepareMotion();
}

function fitnessAge(f) {
  var lo = f.chronological - 15, hi = f.chronological + 15, pos = function (a) { return clamp((a - lo) / (hi - lo), 0, 1); };
  var A0 = -120, A1 = 120, ang = function (a) { return A0 + pos(a) * (A1 - A0); };
  var dot = function (a, fill, stroke) { var p = polar(100, 100, 78, ang(a)); return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="8" fill="' + fill + '" stroke="' + stroke + '" stroke-width="3"/>'; };
  var diff = f.chronological - f.age, delta = has(f.previous) ? f.age - f.previous : 0;
  var svg = '<svg viewBox="0 0 200 160" style="width:100%;max-width:300px;display:block;margin:0 auto"><defs>' + grad("gFa", "#4c6ef5", "#7ee7d6") + '</defs>' +
    '<path d="' + arc(100, 100, 78, A0, A1) + '" fill="none" stroke="var(--track)" stroke-width="12" stroke-linecap="round"/>' +
    (Math.abs(ang(f.chronological) - ang(f.age)) > 1 ? '<path d="' + arc(100, 100, 78, Math.min(ang(f.age), ang(f.chronological)), Math.max(ang(f.age), ang(f.chronological))) + '" fill="none" stroke="var(--band)" stroke-width="12" stroke-linecap="butt" opacity=".75"/>' : "") +
    '<path class="draw" d="' + arc(100, 100, 78, A0, Math.max(ang(f.age), A0 + 1)) + '" fill="none" stroke="url(#gFa)" stroke-width="12" stroke-linecap="round"/>' +
    dot(f.chronological, "var(--card)", "var(--sub)") + dot(f.age, "var(--card)", "var(--green)") +
    '<circle class="glow" cx="100" cy="100" r="44" fill="#4c6ef5"/><circle class="plate" cx="100" cy="100" r="62"/>' +
    '<text x="100" y="98" class="gv" style="font-size:44px" data-count="' + f.age.toFixed(1) + '" data-dec="1">' + f.age.toFixed(1) + '</text><text x="100" y="120" class="gu" text-anchor="middle">years</text></svg>';
  var rows = [["Chronological age", f.chronological + " yrs"]];
  if (has(f.resting_hr)) rows.push(["Resting heart rate", f.resting_hr + " bpm"]);
  if (has(f.vigorous_minutes_avg)) rows.push(["Vigorous minutes / week", String(f.vigorous_minutes_avg)]);
  if (has(f.vigorous_days_avg)) rows.push(["Vigorous days / week", String(f.vigorous_days_avg)]);
  if (has(f.bmi)) rows.push(["BMI", String(f.bmi)]);
  return '<div class="card fa">' + svg + '<div class="' + (diff >= 0 ? "ok" : "warn") + '" style="font-weight:650">' + Math.abs(diff).toFixed(1) + " years " + (diff >= 0 ? "younger" : "older") + " than your age</div>" +
    (has(f.previous) ? '<div class="cap">' + (delta === 0 ? "Unchanged" : (delta < 0 ? "▼ " : "▲ ") + Math.abs(delta).toFixed(1)) + " since last update</div>" : "") +
    (f.updated && !f.saved_at ? '<div class="cap" style="margin-top:4px">Garmin updated ' + new Date(f.updated.slice(0, 10) + "T00:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" }) + "</div>" : "") +
    (f.saved_at ? '<div class="cap" style="margin-top:4px">Saved value from ' + new Date(f.saved_at).toLocaleDateString("en-US", { month: "short", day: "numeric" }) + ". Garmin did not answer just now.</div>" : "") +
    '<div class="rows">' + rows.map(function (r) { return "<div><span class=\"cap\">" + r[0] + "</span><b>" + r[1] + "</b></div>"; }).join("") + "</div></div>";
}

function sleepCard(s) {
  var segs = [["Deep", s.deep_s, "var(--blue)"], ["Light", s.light_s, "var(--teal)"], ["REM", s.rem_s, "var(--purple)"], ["Awake", s.awake_s, "var(--orange)"]].filter(function (x) { return x[1]; });
  var tot = segs.reduce(function (a, x) { return a + x[1]; }, 0) || 1;
  var pctOf = { Deep: s.stages && s.stages.deep_pct, Light: s.stages && s.stages.light_pct, REM: s.stages && s.stages.rem_pct };
  var head = '<div class="row-between"><div><div class="num" style="font-size:28px">' + hm(s.total_s) + '</div><div class="cap">Time asleep</div></div>' +
    (has(s.start_local) ? '<div class="cap">' + clock(s.start_local) + " – " + clock(s.end_local) + "</div>" : "") + "</div>";
  var bar = '<div class="stages">' + segs.map(function (x) { return '<i data-w="' + (x[1] / tot * 100).toFixed(1) + '" style="width:' + (x[1] / tot * 100).toFixed(1) + "%;background:" + x[2] + '"></i>'; }).join("") + "</div>";
  var list = '<div class="grid2">' + segs.map(function (x) {
    var p = has(pctOf[x[0]]) ? pctOf[x[0]] : Math.round(x[1] / tot * 100);
    return '<div class="stage"><div><div class="n">' + x[0] + '</div><div class="d num">' + hmShort(x[1]) + '</div></div><div class="p" style="color:' + x[2] + '">' + p + "%</div></div>";
  }).join("") + "</div>";
  return '<div class="card">' + head + bar + list + "</div>";
}

function trends(rows) {
  var spec = [["Resting Heart Rate", "resting_hr", "bpm", "var(--pink)"], ["Stress", "stress_avg", "", "var(--yellow)"], ["Body Battery (high)", "body_battery_max", "", "var(--green)"]];
  return '<div class="card">' + spec.map(function (s) {
    var vals = rows.map(function (r) { return r[s[1]]; }), last = vals.filter(has).pop();
    if (!has(last)) return "";
    return '<div class="trend"><div><div class="cap">' + s[0] + '</div><div class="num" style="font-size:24px" data-count="' + last + '">' + last + (s[2] ? '<span class="unit">' + s[2] + "</span>" : "") + "</div></div>" + spark(vals, s[3]) + "</div>";
  }).join("") + "</div>";
}

function refresh(btn) {
  btn.disabled = true; btn.textContent = "Refreshing…";
  var done = false, t = setTimeout(function () { if (!done) { btn.disabled = false; btn.textContent = "Refresh unavailable here"; } }, 25000);
  request("tools/call", { name: "garmin_today", arguments: { refresh: true } }).then(function (r) {
    done = true; clearTimeout(t);
    var d = r && dataOf(r);
    if (d && !d.stale && !(d.warnings && d.warnings.length >= 3)) render(d);
    else { btn.disabled = false; btn.textContent = "Still unavailable, try again"; }
  });
}
// ---------- on-load motion: plays per card as it scrolls into view ----------
var reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function ease(t) { return 1 - Math.pow(1 - t, 3); }
function fmtCount(el, v) {
  if (el.hasAttribute("data-loc")) return Math.round(v).toLocaleString("en-US");
  return v.toFixed(+el.getAttribute("data-dec") || 0);
}
function countTo(el) {
  var to = parseFloat(el.getAttribute("data-count")), node = el.firstChild;
  if (isNaN(to) || !node || node.nodeType !== 3) return;
  var t0 = null;
  function step(ts) {
    if (t0 === null) t0 = ts;
    var p = Math.min(1, (ts - t0) / 900);
    node.nodeValue = fmtCount(el, to * ease(p));
    if (p < 1) requestAnimationFrame(step); else node.nodeValue = fmtCount(el, to);
  }
  requestAnimationFrame(step);
}
function play(g) {
  g.classList.add("in");
  g.querySelectorAll(".draw").forEach(function (p) { p.style.transition = "stroke-dashoffset 1s cubic-bezier(.22,.8,.3,1) 150ms"; p.style.strokeDashoffset = 0; });
  g.querySelectorAll(".fillarea").forEach(function (f) { f.style.transition = "clip-path 1.1s cubic-bezier(.22,.8,.3,1) 250ms"; f.style.clipPath = "inset(0 0 0 0)"; });
  g.querySelectorAll("[data-w]").forEach(function (b) { b.style.transition = "width 1s cubic-bezier(.22,.8,.3,1) 200ms"; b.style.width = b.getAttribute("data-w") + "%"; });
  g.querySelectorAll("[data-count]").forEach(countTo);
  g.querySelectorAll(".tick").forEach(function (t, i) { setTimeout(function () { t.classList.add("in"); }, 200 + i * 12); });
}
function prepareMotion() {
  var app = $("app");
  if (reduceMotion || /[?&]still\b/.test(location.search) || !("IntersectionObserver" in window)) return; // ?still: static render for screenshots
  var groups = app.querySelectorAll(".card, .tile, .banner");
  app.classList.add("anim");
  groups.forEach(function (g, i) { g.classList.add("reveal"); g.style.setProperty("--d", (i % 4) * 60 + "ms"); });
  app.querySelectorAll(".draw").forEach(function (p) { var len = p.getTotalLength(); p.style.strokeDasharray = len; p.style.strokeDashoffset = len; });
  app.querySelectorAll(".fillarea").forEach(function (f) { f.style.clipPath = "inset(0 100% 0 0)"; });
  app.querySelectorAll("[data-w]").forEach(function (b) { b.style.width = "0%"; });
  app.querySelectorAll("[data-count]").forEach(function (n) { if (n.firstChild && n.firstChild.nodeType === 3) n.firstChild.nodeValue = fmtCount(n, 0); });
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) { if (e.isIntersecting) { io.unobserve(e.target); play(e.target); } });
  }, { threshold: 0.15 });
  groups.forEach(function (g) { io.observe(g); });
  // failsafe: never leave a card hidden if the browser never reports visibility
  setTimeout(function () { groups.forEach(function (g) { if (!g.classList.contains("in")) { io.unobserve(g); play(g); } }); }, 6000);
}
window.__render = render; // test harness hook
</script>
</body>
</html>
